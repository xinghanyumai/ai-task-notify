name: CI

# 两道门：PR 上拦、main 上兜底。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支连续推送时取消上一轮，省 runner 也省等待
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    # 2 OS × 3 Python = 6 个 job。fail-fast：任一组合红了就停掉其余，
    # 不让 5 个绿勾掩盖 1 个红叉。
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]

    env:
      # Windows runner 默认按 cp936 处理 stdio，断言里的中文/符号会 encode 失败
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装开发依赖
        run: python -m pip install -r requirements-dev.txt

      # ---------------------------------------------------------------
      # 检查项按「快 → 慢」排，任何一步失败后续不再执行：
      #   ruff（秒级，纯静态） → compileall（秒级，语法/字节码）
      #   → pytest（十秒级，真实执行）
      # 只有 Windows 跑前两步：本项目是 Windows 专有实现（DWM 标题栏、
      # icacls、SPI_GETCLIENTAREAANIMATION），在 ubuntu 上静态检查跑通
      # 不代表任何东西，反而会给人「跨平台可用」的错觉。
      # ubuntu 只负责回答一个问题：纯逻辑层（折行/清洗/过滤/事件）是不是
      # 真的与平台无关。
      # ---------------------------------------------------------------

      - name: ruff check
        if: runner.os == 'Windows'
        run: python -m ruff check --output-format=github .

      - name: byte-compile
        if: runner.os == 'Windows'
        run: python -m compileall -q -x '(^|[/\\])\.venv' .

      - name: pytest
        # 不加 -k：平台差异由用例内的 pytest.mark.skipif 表达，
        # 这样 ubuntu 上被跳过的东西会以 skipped 出现在报告里，而不是消失。
        run: python -m pytest -q

  # ---------------------------------------------------------------------
  # 打包。**只挂在 test 全绿之后**（`needs: test`）：
  # 一个连 514 条测试都过不了的提交，产出的 exe 没有分发价值，
  # 而打包要 2~3 分钟，让它在红灯的提交上白跑是浪费。
  #
  # 这个 job 能证明的：exe 打得出来、体积没爆、`--version` 能退出、
  # webui 文件数对得上（`tools/build_exe.py` 自己会核）。
  # 它**证明不了**的：「双击能开窗、五页都能进、hook 能发到手机」——
  # 那两条必须人工在干净机器上过，见 docs/prompts/W7-单文件打包.md §4。
  # 不许因为 CI 有绿勾就把人工那两条省了。
  # ---------------------------------------------------------------------
  package:
    name: Windows 打包
    runs-on: windows-latest
    needs: test
    timeout-minutes: 20

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: python -m pip install -r requirements.txt pyinstaller

      # build_exe.py 内部会做四件检查：产物形态 / webui 文件数 / 体积上限 /
      # --version 冒烟。所以这一步红 = 打包本身有问题，不是「脚本没跑完」。
      - name: 打包
        run: python tools/build_exe.py

      # 再单独跑一遍冒烟，留一条不依赖 build_exe.py 内部逻辑的日志。
      #
      # **不能用 `& ".\通知.exe" --version` + `$LASTEXITCODE`。** 这个 exe 是
      # GUI 子系统（`console=False`）编的，PowerShell 对 GUI 程序**不等**，
      # `$LASTEXITCODE` 压根不会被设置（是空值），于是 `-ne 0` 永远成立。
      # 前 7 轮死在 build_exe.py 的冒烟里，这一步没跑到；第 8 轮一跑到就红，
      # 报的是「冒烟失败：退出码 」（后面空着）——而 exe 本身 1.2 秒退出 0。
      #
      # 要拿真退出码只能用 `Start-Process -Wait -PassThru`。顺手把 stdout
      # 重定向到文件：**重定向正是那个 UnicodeEncodeError 的触发条件**
      # （cp1252 的 stdout + 一行中文），所以这一步现在是那条回归的哨兵——
      # 一旦 stdout 上又开始抛异常，这里立刻以退出码非 0 报出来。
      - name: 冒烟（--version）
        run: |
          if (-not (Test-Path "WBNotify\通知.exe")) { throw "没产出 WBNotify\通知.exe（应在仓库根的子目录里）" }
          if (-not (Test-Path "WBNotify\_internal\webui\index.html")) { throw "WBNotify\_internal\webui\index.html 不在——界面会白屏" }
          $out = Join-Path $env:RUNNER_TEMP "version.out"
          $err = Join-Path $env:RUNNER_TEMP "version.err"
          $p = Start-Process -FilePath ".\WBNotify\通知.exe" -ArgumentList "--version" -Wait -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $text = if (Test-Path $out) { Get-Content $out -Raw } else { "" }
          $diag = if (Test-Path $err) { Get-Content $err -Raw } else { "" }
          if ($p.ExitCode -ne 0) {
            throw "冒烟失败：退出码 $($p.ExitCode)，stderr=$diag"
          }
          if (-not $text) {
            throw "冒烟失败：退出码 0 但 stdout 是空的（--version 没输出）"
          }
          Write-Output "冒烟通过：退出码 0，输出 $($text.Trim())"
        shell: pwsh

      # 分发形态变了，交付物也从「一个 exe」变成「一个 zip」。
      # make_zip.py 自己会拒绝打包「源头脏」的目录（config.json / state / logs
      # 还在 WBNotify/ 里），所以这一步红 = 有凭证会被打进包里。
      - name: 打 zip
        run: python tools/make_zip.py

      - uses: actions/upload-artifact@v4
        with:
          name: notify-onedir
          path: WBNotify/
          # 打包是唯一不可逆的交付物，别让它 7 天后自动消失
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: notify-zip
          path: WBNotify-v*-win64.zip
          retention-days: 30
          if-no-files-found: error
