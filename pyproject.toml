# 这里只放工具配置，不做打包。
#
# 为什么没有 [build-system] / [project]：
# 本项目是「一个目录 + 双击运行」的便携工具，不是库。config.json / state/ / logs/
# 全部基于 wbn/config.py 里的 ROOT = Path(__file__).parent.parent 推导，
# 一旦 pip install 到 site-packages，ROOT 会变成 Python 安装目录，
# 配置和日志就写到不该去的地方。所以刻意不做可安装包。
#
# 装依赖用 requirements.txt；跑起来直接 python ui.py。

[tool.ruff]
line-length = 100
target-version = "py310"
# 项目里有大量中文注释和说明性长行，E501 是噪音
extend-exclude = [".venv", "__pycache__", "assets"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # 行长度由 formatter 管，注释里的长句不拦
]

[tool.ruff.lint.per-file-ignores]
# 自检与审查脚本是给人读输出的，允许 print
"selftest.py" = ["T201"]
"audit.py" = ["T201"]
"install.py" = ["T201"]
"shot.py" = ["T201"]
"make_icon.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 只默认跳过 network。gui 类用例不在这里排除——它们靠 pytest.mark.skipif
# 按 sys.platform 自己跳过，这样 Windows 上仍然是全量。
addopts = "-m 'not network' --tb=short -ra"
markers = [
    "gui: 需要真实窗口 / 图形栈的用例，非 Windows 或无声环境自动 skip",
    "network: 会发起真实网络请求（含发通知），默认跳过，-m network 显式跑",
]
